<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>Android • APK műhely</title><style>body{margin:0;background:#0b1220;color:#e7eefc;font:16px system-ui,sans-serif}main{max-width:900px;margin:auto;padding:32px 18px}h1{font-size:clamp(30px,6vw,52px);margin-bottom:8px}p{color:#aab9d2}a{color:#7bdcff}.card{display:block;background:#17243a;border:1px solid #304361;border-radius:16px;padding:18px;margin:12px 0;text-decoration:none;color:#f3f7ff}.card:hover{border-color:#7bdcff}.muted{font-size:13px;color:#aab9d2}button{background:#2c5d91;color:white;border:0;border-radius:9px;padding:10px 16px;cursor:pointer}</style></head><body><main><h1>🤖 Android • APK műhely</h1><p>Android-alkalmazások, projektek és letölthető kiadások. A projektlista automatikusan követi a GitHub-repót.</p><button onclick="load()">🔄 Frissítés</button><h2>📂 Projektek</h2><div id="projects">Betöltés…</div><h2>📦 APK-kiadások</h2><div id="releases">Betöltés…</div><p class="muted">A telepíthető APK-k a GitHub Releases oldalon jelennek meg, ha kiadásként feltöltjük őket.</p></main><script>
const repo='ae6820dc/android',api='https://api.github.com/repos/'+repo;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function get(url){let r=await fetch(url,{headers:{Accept:'application/vnd.github+json'}});if(!r.ok)throw Error('GitHub API: '+r.status);return r.json()}
async function load(){
const p=document.getElementById('projects'),r=document.getElementById('releases');p.textContent='Betöltés…';r.textContent='Betöltés…';
try{const tree=await get(api+'/git/trees/main?recursive=1');if(tree.truncated)throw Error('A fájllista túl nagy.');
const dirs=[...new Set(tree.tree.filter(x=>x.type==='blob'&&x.path.includes('/')).map(x=>x.path.split('/')[0]))].filter(x=>!x.startsWith('.')).sort();
p.innerHTML=dirs.length?dirs.map(d=>'<a class="card" href="https://github.com/'+repo+'/tree/main/'+encodeURIComponent(d)+'">📁 '+esc(d)+'<div class="muted">Projektmappa megnyitása →</div></a>').join(''):'<p>Még nincs projektmappa. Hamarosan érkeznek az első alkalmazások! 🚀</p>';
}catch(e){p.textContent='A projektlista most nem érhető el: '+e.message}
try{const releases=await get(api+'/releases?per_page=30');r.innerHTML=releases.length?releases.map(x=>'<div class="card"><strong>'+esc(x.name||x.tag_name)+'</strong><div class="muted">'+esc(x.tag_name)+'</div>'+x.assets.filter(a=>a.name.toLowerCase().endsWith('.apk')).map(a=>'<p><a href="'+a.browser_download_url+'">⬇️ '+esc(a.name)+'</a></p>').join('')+'<a href="'+x.html_url+'">Kiadás megnyitása →</a></div>').join(''):'<p>Még nincs közzétett APK-kiadás.</p>'}catch(e){r.textContent='A kiadások most nem érhetők el: '+e.message}
}load();</script></body></html>
